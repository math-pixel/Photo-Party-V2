# docker-compose.yml
services:
    # ========== SERVICE FRANKENPHP (tout-en-un) ==========
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: symfony_frankenphp
        working_dir: /app
        volumes:
            # Monter tout le projet
            - ./:/app
            # Donner les droits en écriture sur var/
            - ./var:/app/var:rw
            # ⭐ Volumes pour Caddy/Mercure
            - caddy_data:/data
            - caddy_config:/config
        ports:
            - "8000:80"      # HTTP
            - "8443:443"     # HTTPS (si besoin plus tard)
        environment:
            # ⭐ Configuration serveur
            SERVER_NAME: ":80"

            # ⭐ Base de données SQLite
            DATABASE_URL: "sqlite:////app/var/data.db"
            APP_ENV: dev

            # ⭐ Configuration Mercure (intégré)
            MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
            MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"

            # ⭐ URLs Mercure (même container maintenant !)
            MERCURE_URL: "http://localhost/.well-known/mercure"
            MERCURE_PUBLIC_URL: "http://localhost:8000/.well-known/mercure"
        networks:
            - app-network

# ========== VOLUMES ==========
volumes:
    caddy_data:
    caddy_config:

# ========== NETWORK ==========
networks:
    app-network:
        driver: bridge
